<!-- title: Policies | Futuro Soccer Academy -->
<!-- description: Futuro Soccer Academy policies: child safeguarding, concussion protocol, codes of conduct, refunds, weather cancellations and more. -->
<section class="page-hero">
  <div class="wrap">
    <h1>Club policies.</h1>
    <p class="lede">Every Futuro policy in one place. Search, or open any section to read it in full.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="policy-tools">
      <label class="sr-only" for="policy-search">Search policies</label>
      <input id="policy-search" type="search" placeholder="Search policies, e.g. refund, concussion, weather" autocomplete="off">
    </div>
    <div class="policy-layout">
      <nav class="policy-nav" aria-label="Policy groups">
        {{policy_nav}}
      </nav>
      <div>
        <p id="no-results" class="no-results" hidden>No policies match that search. Try another word, or email <a href="mailto:{{email}}" style="color:var(--sky)">{{email}}</a>.</p>
{{policies}}
      </div>
    </div>
  </div>
</section>
